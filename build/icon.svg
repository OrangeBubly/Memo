<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.55" stop-color="#f07a12"/>
      <stop offset="1" stop-color="#d9530b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7a2a00" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- squircle tile -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="232" rx="116" fill="url(#shine)"/>
  <!-- bold M -->
  <path filter="url(#sh)" fill="#ffffff" d="M104 372 V148 h62 l58 108 l58 -108 h62 V372 h-60 V252 l-60 106 l-60 -106 V372 z"/>
