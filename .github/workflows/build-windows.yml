name: Build & test Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release (tag v<package.json version>) if the build and Windows tests pass'
        type: boolean
        default: false
      replace_existing:
        description: 'If a release for this version already exists, delete it (and its tag) and publish it again from this commit'
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          "Building Memo $v"
          # A release tag must match package.json, so the installer and the release never disagree.
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            "FAIL  tag ${{ github.ref_name }} does not match package.json version $v (expected v$v)"; exit 1
          }

      - name: Install dependencies
        run: npm ci

      # Same pipeline as the files shipped to users: package, stamp icon, NSIS installer, portable exe
      - name: Package app (win-unpacked, icon stamped)
        run: npx electron-builder --win dir --publish never

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress; $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $makensis /V2 /DVERSION=${{ steps.ver.outputs.version }} build\memo-installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable exe
        run: npx electron-builder --win portable --prepackaged dist/win-unpacked --publish never

      - name: Silent install
        shell: pwsh
        run: |
          Start-Process -FilePath "dist\Memo-Setup-${{ steps.ver.outputs.version }}.exe" -ArgumentList '/S' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Memo"
          $ok = $true
          foreach ($p in @("$dir\Memo.exe", "$dir\Uninstall Memo.exe", "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Memo.lnk")) {
            if (Test-Path $p) { "PASS  installed: $p" } else { "FAIL  missing: $p"; $ok = $false }
          }
          $reg = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Memo" -ErrorAction SilentlyContinue
          if ($reg) { "PASS  Add/Remove Programs entry: $($reg.DisplayName) $($reg.DisplayVersion) by $($reg.Publisher)" } else { "FAIL  no uninstall registry entry"; $ok = $false }
          $v = (Get-Item "$dir\Memo.exe").VersionInfo
          "INFO  Memo.exe version info: $($v.ProductName) $($v.FileVersion) / $($v.FileDescription) / $($v.CompanyName)"
          if (-not $ok) { exit 1 }

      - name: Smoke test the installed app
        shell: pwsh
        run: |
          npm install --no-save playwright@1.49.1
          node build/smoke-test.js "$env:LOCALAPPDATA\Programs\Memo\Memo.exe"

      - name: Silent uninstall (keeps user data)
        if: always()
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\Memo"
          if (Test-Path "$dir\Uninstall Memo.exe") {
            Start-Process -FilePath "$dir\Uninstall Memo.exe" -ArgumentList '/S' -Wait
            for ($i = 0; $i -lt 60 -and (Test-Path "$dir\Memo.exe"); $i++) { Start-Sleep 1 }
          }
          if (Test-Path "$dir\Memo.exe") { "FAIL  app files still present after uninstall"; exit 1 } else { "PASS  app files removed" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Memo.lnk") { "FAIL  Start Menu shortcut left behind" } else { "PASS  Start Menu shortcut removed" }
          if (Test-Path "$env:APPDATA\Memo") { "PASS  user data kept at $env:APPDATA\Memo" } else { "WARN  no user data folder found at $env:APPDATA\Memo" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: smoke-shots/

      - uses: actions/upload-artifact@v4
        with:
          name: Memo-Windows
          path: |
            dist/Memo-Setup-*.exe
            dist/Memo-Portable-*.exe

  # Runs for version tags (v1.0.0, ...) or a manual run with "release" ticked,
  # and only if every build + Windows test above passed. Creates the tag if it doesn't exist yet.
  release:
    needs: build-and-test
    if: (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Memo-Windows
          path: release-files
      - name: Replace existing release (only when asked)
        if: github.event_name == 'workflow_dispatch' && inputs.replace_existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.build-and-test.outputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Replacing existing release $TAG"
            gh release delete "$TAG" --repo "${{ github.repository }}" --cleanup-tag --yes
          else
            echo "No existing release $TAG; publishing a new one"
          fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-and-test.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Memo v${{ needs.build-and-test.outputs.version }}
          body_path: .github/release-notes.md
          files: |
            release-files/Memo-Setup-${{ needs.build-and-test.outputs.version }}.exe
            release-files/Memo-Portable-${{ needs.build-and-test.outputs.version }}.exe
          fail_on_unmatched_files: true
