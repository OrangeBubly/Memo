<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: data:">
  <title>Memo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <div class="brand"><span class="logo">M</span> Memo</div>
      <button class="nav-btn" data-view="library">📚 Library</button>
      <button class="nav-btn" data-view="review">⏰ Review <span id="due-badge" class="badge hidden"></span></button>
      <button class="nav-btn" data-view="stats">📈 Progress</button>
      <button class="nav-btn" data-view="settings">⚙️ Settings</button>
      <button class="nav-btn" data-view="help">❓ Help</button>
      <div class="sidebar-foot">
        <div id="streak-pill" class="streak">🔥 0 day streak</div>
        <div id="goal-pill" class="goal"></div>
      </div>
    </nav>
    <main id="main"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
